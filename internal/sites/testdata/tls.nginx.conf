server {
    listen 8443 ssl;
    server_name secure.example.com;
    ssl_certificate     /certs/secure.crt;
    ssl_certificate_key /certs/secure.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        waffynx on;
        waffynx_socket /opt/waffynx/waffynx.sock;
        waffynx_timeout 1000;
        waffynx_fail_open off;
        waffynx_max_body_size 64k;
        proxy_pass http://10.0.0.6:8443;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        waffynx off;
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }
}
