version: "2"

# Constitution §3.3 requires golangci-lint to run "with strict security and
# performance linters enabled". The "standard" set (errcheck, govet,
# ineffassign, staticcheck, unused) is the floor; the enable block below adds
# the security and performance linters that requirement mandates.

run:
  # Linux is the sole production runtime (Constitution §2.1). Linting for the
  # host OS hides the real data-plane code behind build tags (engine_unix.go,
  # engine_windows.go, bridge_cpp_linux.go, bridge_cpp_stub.go).
  go: "1.22"
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    # Security
    - bodyclose
    - gosec
    - nilerr
    # Performance / correctness
    - copyloopvar
    - errorlint
    - unconvert
    - misspell

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: false
      # Idiomatic and unactionable: an http.ResponseWriter that fails mid-write
      # leaves the response already committed, so there is nothing to recover.
      # The status code and the contract are enforced elsewhere.
      exclude-functions:
        - (net/http.ResponseWriter).Write

    gosec:
      excludes:
        # G304: every flagged site loads an OPERATOR-supplied path (config file,
        # nginx binary, TLS cert). None is derived from request data.
        - G304
        # G204: subprocess paths come from validated config, not from requests.
        - G204
        # G107: upstream URLs are built from configured backends.
        - G107

  exclusions:
    generated: lax
    rules:
      # Test files: cleanup errors (`defer x.Close()`) and fixture file modes
      # are noise. G112 (Slowloris) stays enabled everywhere because the
      # sidecar and bridge servers are production listeners.
      - path: _test\.go
        linters:
          - errcheck
          - gosec
        text: G30[246]

issues:
  # Baseline: main already carries legacy linter debt that predates this
  # configuration. Reporting is scoped to issues introduced since the merge
  # base with main, so CI stays actionable without hiding old debt behind
  # blanket exclusions. Burn-down is tracked separately.
  new-from-merge-base: origin/main
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    # Mirrors `gofmt -s` from AGENTS.md §5 so formatting is checked in the same
    # pass as the linters instead of as a separate ad-hoc command.
    - gofmt
  settings:
    gofmt:
      simplify: true
  exclusions:
    generated: lax
