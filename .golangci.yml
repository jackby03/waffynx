version: "2"

# Constitution §3.3 requires golangci-lint to run "with strict security and
# performance linters enabled". The "standard" set (errcheck, govet,
# ineffassign, staticcheck, unused) is the floor; the enable block below adds
# the security and performance linters that requirement mandates.

run:
  # Linux is the sole production runtime (Constitution §2.1). Linting for the
  # host OS hides the real data-plane code behind build tags (engine_unix.go
  # instead of engine_windows.go).
  go: "1.22"
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    # Security
    - bodyclose
    - gosec
    - nilerr
    # Performance / correctness
    - copyloopvar
    - errorlint
    - unconvert
    - misspell

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: false
      # Idiomatic and unactionable: an http.ResponseWriter that fails mid-write
      # leaves the response already committed, so there is nothing to recover.
      # The status code and the contract are enforced elsewhere.
      exclude-functions:
        - (net/http.ResponseWriter).Write

    gosec:
      excludes:
        # G104 (unhandled errors) duplicates errcheck, which is configured here
        # with the ResponseWriter exclusion and owns this signal. Keeping both
        # would report the same 30 sites twice under different names.
        - G104
        # G304: every flagged site loads an OPERATOR-supplied path (config file,
        # nginx binary, TLS cert). None is derived from request data.
        - G304
        # G204: subprocess paths come from validated config, not from requests.
        - G204
        # G107: upstream URLs are built from configured backends.
        - G107

  exclusions:
    generated: lax
    paths:
      # third_party holds C sources (nginx), not Go packages. The path stays
      # excluded so a vendored tree that ever ships `import "C"` files cannot
      # become a package that needs modules absent from go.mod.
      - third_party
    rules:
      # Test files: cleanup (`defer x.Close()`) and fixture errors are not
      # actionable, and the suite asserts behaviour through other means.
      - path: _test\.go
        linters:
          - errcheck
      # File-mode findings raised by test fixtures are likewise noise. G112
      # (Slowloris) is deliberately NOT excluded: it guards real listeners.
      - path: _test\.go
        linters:
          - gosec
        text: G30[246]

issues:
  # No baseline: the tree is clean, so every finding is a regression. Keep it
  # that way rather than reintroducing a merge-base filter (AGENTS.md §7.2).
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    # Mirrors `gofmt -s` from AGENTS.md §5 so formatting is checked in the same
    # pass as the linters instead of as a separate ad-hoc command.
    - gofmt
  settings:
    gofmt:
      simplify: true
  exclusions:
    generated: lax
