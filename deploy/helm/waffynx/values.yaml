# Waffynx Zero-Trust Multi-Container Helm Values (Constitution §1.3, §1.4, §2.1, §2.2)
# Production secrets MUST be supplied via existingSecret (never hardcoded in values).

secrets:
  # Kubernetes Secret containing keys:
  #   jwt-secret, admin-password, postgres-dsn, redis-password, clickhouse-password
  existingSecret: "waffynx-secrets"

mtls:
  enabled: true
  # Kubernetes Secret (e.g. provisioned by cert-manager / SPIRE / step-ca) holding
  # ca.crt, envoy.crt, envoy.key, waf-engine.crt, waf-engine.key, control-api.crt, control-api.key
  certsSecretName: "waffynx-mesh-certs"

envoy:
  replicaCount: 2
  image:
    repository: envoyproxy/envoy
    tag: v1.32-latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    httpPort: 8080
    httpsPort: 8443
  resources:
    limits:
      cpu: 1000m
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 128Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

wafEngine:
  replicaCount: 2
  image:
    repository: ghcr.io/jackby03/waffynx-engine
    tag: latest
    pullPolicy: IfNotPresent
  grpcPort: 50051
  healthPort: 8081
  maxBodyBytes: 1048576
  shadowMode: false
  rateLimitEnabled: true
  rateLimitRPS: 100
  # Fail-closed by default (Constitution §1.1); set true only for controlled rate-limit degradation.
  rateLimitFailOpen: false
  redisTimeoutMs: 10
  resources:
    limits:
      cpu: 1000m
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 128Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 12
    targetCPUUtilizationPercentage: 70

controlApi:
  replicaCount: 1
  image:
    repository: ghcr.io/jackby03/waffynx-control-api
    tag: latest
    pullPolicy: IfNotPresent
  apiPort: 9090
  xdsPort: 18000
  adminUser: "admin"
  initialSiteHost: "app.example.test"
  initialSiteUpstream: "backend:80"
  edgeTLS: true
  upstreamMTLS: false
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

ui:
  replicaCount: 1
  image:
    repository: ghcr.io/jackby03/waffynx-ui
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi

logIngestor:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/jackby03/waffynx-ingestor
    tag: latest
    pullPolicy: IfNotPresent
  healthPort: 8082
  batchSize: 500
  flushMs: 1000
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

externalServices:
  redisAddr: "redis:6379"
  natsURL: "nats://nats:4222"
  clickhouseURL: "http://clickhouse:8123"
  clickhouseDB: "waffynx"
  clickhouseUser: "waffynx"

networkPolicies:
  enabled: true

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: app.example.test
      paths:
        - path: /
          pathType: Prefix
  tls: []
