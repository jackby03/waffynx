worker_processes 1;
error_log /opt/waffynx/logs/nginx-error.log warn;
pid /opt/waffynx/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /opt/waffynx/nginx/conf/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    access_log /opt/waffynx/logs/nginx-access.log;

    # The reverse-proxy topology is generated from the `sites:` config by the
    # bootstrap and /api/v1/sites. Each fragment is a complete server block, so
    # there is no hardcoded backend here. An include glob that matches nothing is
    # not an nginx error, which keeps a zero-site install bootable; the rendered
    # fragments carry the WAF directives and the /health location.
    include /opt/waffynx/nginx/conf/sites/*.conf;
}
