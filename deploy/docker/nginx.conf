worker_processes 1;
error_log /opt/waffynx/logs/nginx-error.log warn;
pid /opt/waffynx/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /opt/waffynx/nginx/conf/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    access_log /opt/waffynx/logs/nginx-access.log;

    server {
        listen 8080;
        server_name localhost;

        location / {
            waffynx on;
            waffynx_socket /opt/waffynx/waffynx.sock;
            waffynx_timeout 1000;
            waffynx_fail_open on;
            waffynx_max_body_size 64k;
            proxy_pass http://backend:80;
            proxy_set_header Host $host;
        }

        location /health {
            waffynx off;
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }
    }

    server {
        listen 8443 ssl;
        server_name localhost;

        ssl_certificate /opt/waffynx/certs/server.crt;
        ssl_certificate_key /opt/waffynx/certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            waffynx on;
            waffynx_socket /opt/waffynx/waffynx.sock;
            waffynx_timeout 1000;
            waffynx_fail_open on;
            waffynx_max_body_size 64k;
            proxy_pass http://backend:80;
            proxy_set_header Host $host;
        }

        location /health {
            waffynx off;
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }
    }
}
