worker_processes 1;
error_log /opt/waffynx/logs/nginx-error.log warn;
pid /opt/waffynx/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /opt/waffynx/nginx/conf/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    access_log /opt/waffynx/logs/nginx-access.log;

    # Permanent orchestrator probe. It must exist before the include so it is the
    # default server on the plain listener: an unmatched Host gets a 404 instead of
    # being proxied, which is strictly safer than the old `server_name localhost`
    # that forwarded unmatched hosts to backend:80. This block only serves the
    # probe and a 404; it cannot forward traffic and it never inspects a request.
    server {
        listen 8080;
        server_name _;

        # A server-level `return 404;` would run before location selection and
        # would 404 /health as well, so guard the return. Only /health reaches its
        # location; every other URI is rejected here, before any location can
        # forward or inspect it.
        if ($uri != /health) {
            return 404;
        }

        location = /health {
            waffynx off;
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }
    }

    # The reverse-proxy topology is generated from the `sites:` config by the
    # bootstrap and /api/v1/sites. Each fragment is a complete server block, so
    # there is no hardcoded backend here. An include glob that matches nothing is
    # not an nginx error, which keeps a zero-site install bootable; the rendered
    # fragments carry the WAF directives and the /health location. The probe above
    # remains the default server on 8080; TLS sites still own 8443 exclusively.
    include /opt/waffynx/nginx/conf/sites/*.conf;
}
