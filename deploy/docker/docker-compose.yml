version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: waffynx
      POSTGRES_USER: waffynx
      POSTGRES_PASSWORD: waffynx_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waffynx"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    ports:
      - "9090:9090"
    environment:
      WAFFYNX_CONFIG: /etc/waffynx/waffynx.yaml
      DATABASE_URL: postgres://waffynx:waffynx_dev@postgres:5432/waffynx?sslmode=disable
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../../configs:/etc/waffynx:ro

volumes:
  pgdata:
