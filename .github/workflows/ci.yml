name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build Go (no CGo)
        run: CGO_ENABLED=0 go build -buildvcs=false ./cmd/...

      - name: Test Go
        run: CGO_ENABLED=0 go test -coverprofile=coverage.out ./internal/...

      - name: Coverage
        run: go tool cover -func=coverage.out

  cpp-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install C++ dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            cmake g++ \
            libboost-all-dev \
            libpcre2-dev \
            libssl-dev \
            zlib1g-dev \
            libmaxminddb-dev \
            libcurl4-openssl-dev \
            libgtest-dev libgmock-dev \
            libbrotli-dev libxml2-dev

      - name: Build open-appsec (libngen_core.so)
        working-directory: third_party/open-appsec
        run: |
          # Fix bison version requirement for newer bison
          sed -i 's/%require "3"/%require "3.0"/' external/graphqlparser/parser.ypp 2>/dev/null || true
          
          mkdir -p build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build . --target ngen_core -j$(nproc)
          ls -lh core/libngen_core.so
          strip core/libngen_core.so
          echo "libngen_core.so size: $(ls -lh core/libngen_core.so | awk '{print $5}')"

      - name: Build C bridge (libwaffynx_bridge.so)
        working-directory: third_party/open-appsec
        run: |
          # Stub mode — no open-appsec headers needed, just pattern matching
          g++ -shared -fPIC -std=c++17 -O2 \
            -o libwaffynx_bridge.so waffynx_bridge.cpp
          ls -lh libwaffynx_bridge.so
          echo "Bridge built (stub mode)"

      - name: Build Go with CGo (appsec-bridge-cpp)
        run: |
          CGO_ENABLED=1 go build -buildvcs=false -ldflags="-s -w" \
            -o bin/appsec-bridge-cpp ./cmd/appsec-bridge
          ls -lh bin/appsec-bridge-cpp || echo "CGo binary built"
