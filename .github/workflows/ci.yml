name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build Go (no CGo)
        run: CGO_ENABLED=0 go build -buildvcs=false -o dist/ ./cmd/...

      - name: Test Go
        run: CGO_ENABLED=0 go test -coverprofile=coverage.out ./internal/...

      - name: Coverage
        run: go tool cover -func=coverage.out

  cpp-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install C++ dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential cmake bison flex \
            g++ \
            libboost-all-dev \
            libpcre2-dev \
            libssl-dev \
            zlib1g-dev \
            libmaxminddb-dev \
            libcurl4-openssl-dev \
            libgtest-dev libgmock-dev \
            libbrotli-dev libxml2-dev

      - name: Build C++ Bridge
        run: make bridge-build

      - name: Build Go with CGo (appsec-bridge-cpp)
        run: |
          CGO_ENABLED=1 go build -buildvcs=false -ldflags="-s -w" \
            -o dist/appsec-bridge-cpp ./cmd/appsec-bridge
          ls -lh dist/

      - name: Test Go CGo Bridge
        run: CGO_ENABLED=1 go test -v ./internal/appsec/...

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bridge-libs
          path: dist/*

