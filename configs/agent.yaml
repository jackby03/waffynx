name: "waf-agent"
listen: ":9099"
api_key: "change-me-in-production"
firewall:
  enabled: true
  backend: "nftables"
  default_in: "deny"
  default_out: "allow"
  managed_ports:
    - 80
    - 443
    - 8443
  block_list:
    # Known malicious IPs blocked on startup
    # - "192.0.2.1"
    # - "198.51.100.0/24"
