# ============================================================================
# Waffynx - Next Generation WAF Configuration
# ============================================================================

name: "waffynx"
version: "1"

# -- Main listen address for the gateway --
listen: ":8443"

# -- Sidecar (Go <-> nginx bridge) --
sidecar:
  socket_path: "/opt/waffynx/waffynx.sock"
  # nginx drops its worker processes to an unprivileged user, so the sidecar
  # socket must be group-accessible or the workers get EACCES and, with
  # fail_open off, every request turns into a 403. Debian ships nobody:nogroup.
  socket_group: "nogroup"
  fail_open: false      # fail-closed: block requests if sidecar is unreachable
  timeout_ms: 100       # max ms to wait for sidecar response
  # Optional authenticated bridge for dashboard security events.
  # event_api_url: "http://127.0.0.1:9090/api/v1/events"
  # event_auth_token: "<signed JWT with events:write scope>"
  event_timeout_ms: 200

# -- Structured logging --
logging:
  level: "info"       # debug, info, warn, error
  format: "json"      # json, console
  output: "stdout"    # stdout, stderr, /var/log/waffynx.log

# -- Forked nginx engine configuration --
nginx:
  binary_path: "/opt/waffynx/nginx/sbin/nginx"
  config_path: "/opt/waffynx/nginx/conf"
  worker_processes: 0          # 0 = auto
  worker_connections: 65535
  enable_http2: true
  enable_http3: false

# -- Open-appsec integration --
appsec:
  enabled: true
  rules_path: "/opt/waffynx/appsec/rules"
  ml_model_path: "/opt/waffynx/appsec/models"
  learning_mode: false          # Enable learning mode for ML-based detection

# -- API Gateway settings --
gateway:
  max_connections: 65535
  read_timeout: 60
  write_timeout: 60
  idle_timeout: 120
  enable_rate_limiting: false

# -- Host firewall integration (UFW / nftables) --
# SYSTEM MODE ONLY. These drivers shell out to `nft` / `ufw` on the host, so they
# need root and do nothing useful inside a container (without NET_ADMIN they fail;
# with --net host they would touch the host, which is worse). The container
# entrypoint does not start waf-agent and IP bans are enforced at the WAF layer
# instead, which is why this defaults to disabled. Enable it only for a systemd
# / bare-metal deployment.
firewall:
  enabled: false
  backend: "nftables"           # nftables, ufw
  default_in: "deny"            # deny, allow
  default_out: "allow"          # deny, allow
  managed_ports:
    - 80
    - 443
    - 8443

# -- Management API --
api:
  enabled: true
  listen: ":9090"
  auth:
    jwt_secret: "change-me-in-production"
    token_ttl: 3600
    users:
      # Generate with: go run golang.org/x/crypto/bcrypt/cmd/htpasswd@latest -nbB admin <password>
      - username: admin
        password_hash: "$2a$10$placeholder_hash_change_me"

# -- Route definitions (API Gateway) --
routes:
  - name: "api-backend"
    host: "api.example.com"
    path: "/*"
    methods:
      - GET
      - POST
      - PUT
      - DELETE
    upstream: "http://127.0.0.1:3000"
    plugins:
      - rate-limit
      - request-validation

  - name: "web-frontend"
    host: "app.example.com"
    path: "/*"
    methods:
      - GET
    upstream: "http://127.0.0.1:4000"
    headers:
      X-Frame-Options: "DENY"
      X-Content-Type-Options: "nosniff"

# -- Enabled plugins --
plugins:
  - name: "rate-limit"
    enabled: true
    config:
      requests_per_second: 100
      burst: 200
      # Redis backend for shared rate limiting across instances:
      # redis:
      #   enabled: true
      #   addr: "localhost:6379"
      #   password: ""
      #   db: 0

  - name: "geo-block"
    enabled: false
    config:
      mode: "block"         # block | allow
      db_path: "/opt/waffynx/geoip/GeoLite2-Country.mmdb"
      allowed_countries:
        - "MX"
        - "US"
        - "CA"

  - name: "bot-protection"
    enabled: true
    config:
      challenge_type: "js"      # js, captcha, header
      mode: "log"               # log, block

  - name: "request-validation"
    enabled: true
    config:
      max_body_size: 10485760   # 10MB
      allowed_content_types:
        - "application/json"
        - "application/x-www-form-urlencoded"
        - "multipart/form-data"

# -- Reverse-proxy topology (SPEC-003) --
#
# `sites:` is the host -> upstream list that gets rendered into nginx fragments
# under <nginx.config_path>/sites/ and made live with `nginx -t` + reload. It is
# validated by the same rules the management API uses, so a host containing ';'
# or '{' is rejected at load time rather than injected into nginx.
#
# It is intentionally left commented out: rendering and applying are not wired into
# startup yet (SPEC-003 phases 2/4). Adding a site here today would parse and
# validate but protect nothing, which is exactly the kind of false promise this
# project is trying to avoid.
#
# sites:
#   - host: "app.example.com"
#     upstream: "10.0.0.5:8080"
#     tls:
#       cert_file: "/opt/waffynx/certs/app.example.com.crt"
#       key_file: "/opt/waffynx/certs/app.example.com.key"
#     headers:
#       X-Frame-Options: "DENY"
#
#   - host: "*.api.example.com"
#     upstream: "http://api-backend:9000"
#     paths:
#       - path: "/v2"
#         upstream: "http://api-backend-v2:9000"
