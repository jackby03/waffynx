# ============================================================================
# nginx.conf -- Generated by Waffynx
# 
# This nginx has the ngx_waffynx_module compiled in. The module intercepts
# every request at the ACCESS phase and asks the Go sidecar over Unix socket.
# ============================================================================

worker_processes auto;
worker_rlimit_nofile 65535;

error_log /opt/waffynx/logs/error.log warn;
pid /opt/waffynx/logs/nginx.pid;

events {
    worker_connections 65535;
    use epoll;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format waffynx '$remote_addr - $remote_user [$time_local] '
                       '"$request" $status $body_bytes_sent '
                       '"$http_referer" "$http_user_agent" '
                       '$request_time';

    access_log /opt/waffynx/logs/access.log waffynx;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    keepalive_requests 1000;

    # ================================================================
    # Waffynx WAF + API Gateway
    # ================================================================
    server {
        listen 80;
        listen 443 ssl;
        server_name _;

        # TLS (phase 3+)
        # ssl_certificate     /opt/waffynx/ssl/cert.pem;
        # ssl_certificate_key /opt/waffynx/ssl/key.pem;

        # -- Safety limits --
        client_max_body_size     10m;
        client_body_buffer_size  128k;
        client_header_buffer_size 4k;
        large_client_header_buffers 4 16k;

        # ============================================================
        # WAFFYNX MODULE: every request in this location is evaluated
        # by the Go sidecar before reaching the backend.
        # ============================================================
        location / {
            waffynx on;
            waffynx_socket /var/run/waffynx.sock;
            waffynx_timeout 100;
            waffynx_fail_open on;   # allow if sidecar is down

            proxy_pass http://127.0.0.1:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check -- bypass WAF
        location /health {
            waffynx off;
            access_log off;
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }

        # Metrics -- bypass WAF
        location /metrics {
            waffynx off;
            proxy_pass http://127.0.0.1:9090/metrics;
        }
    }
}
